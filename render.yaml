# פריסה ב-Render בלחיצה אחת (Blueprint). בלי כרטיס אשראי.
#
# אזהרה: התוכנית החינמית היא 512MB זיכרון ו-0.1 CPU, והשירות נרדם
# אחרי 15 דקות בלי תנועה. צריך מעיר חיצוני (ראו README).
services:
  - type: web
    name: kav-shirim
    runtime: docker
    plan: free
    region: frankfurt          # הקרוב ביותר לישראל מבין אזורי Render
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: EXT_PATH
        value: "8"
      # שלוחת הספרייה: כאן נשמרים השירים שהורדו, לצמיתות.
      # חייבת להיות שלוחה אחרת מ-EXT_PATH.
      - key: LIB_PATH
        value: "6"
      # הסודות נכנסים ידנית בלוח הבקרה של Render, לא בקובץ הזה
      - key: YEMOT_TOKEN
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      # עוגיות יוטיוב. נדרש! בלעדיהן יוטיוב מחזיר "Sign in to confirm
      # you're not a bot" מכל כתובת ענן - נמדד ב-17.11.2026 על Codespaces.
      # מייצרים עם refresh-cookies.py (מעתיק ללוח).
      - key: COOKIES_B64
        sync: false
