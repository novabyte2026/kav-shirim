# פריסה ב-Render (תוכנית חינם, Docker). Render בונה מחדש בכל דחיפה ל-main.
# הסודות (YEMOT_TOKEN, GEMINI_API_KEYS, COOKIES_B64) נכנסים ידנית בלוח
# הבקרה של Render, אף פעם לא לקובץ הזה.
services:
  - type: web
    name: kav-shirim
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ping
    envVars:
      # שלוחת עבודה: הקלטות, קובץ שקט ואינדקס הספרייה
      - key: EXT_PATH
        value: "8"
      # שלוחת הספרייה: השירים עצמם, ממוספרים 000, 001...
      - key: LIB_PATH
        value: "6"
      # שירים שיורדו לספרייה בעלייה (בדיקה של כל המסלול). ריק = כבוי.
      # זהירות: החיפוש מחזיר לפעמים סרטון אחר, ואז נוסף עוד עותק בכל עלייה.
      - key: SEED_SONGS
        value: ""
      - key: YEMOT_TOKEN
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: COOKIES_B64
        sync: false
